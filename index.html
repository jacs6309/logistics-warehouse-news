<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>물류창고 업계 뉴스</title>
<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;
    --ink:#1f2430;
    --ink-soft:#5b6270;
    --line:#e4e4e0;
    --accent:#2f5d50;
    --accent-soft:#e8f0ed;
    --badge-kl:#2f5d50;
    --badge-g:#3b5bdb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:24px 16px 64px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{margin-bottom:20px;}
  h1{font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--ink-soft);font-size:0.88rem;margin:0;}

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:20px;
  }
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  button#searchBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    flex:0 0 auto;
  }
  button#searchBtn:disabled{opacity:0.6;cursor:default;}
  button#searchBtn:hover:not(:disabled){filter:brightness(1.05);}

  .toggle-kw{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:0.82rem;
    cursor:pointer;
    text-decoration:underline;
    padding:4px 0;
  }
  #kwBox{display:none;margin-top:12px;}
  #kwBox.open{display:block;}
  #kwInput{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:0.88rem;
  }
  .kwHint{color:var(--ink-soft);font-size:0.78rem;margin:6px 0 0;}

  .status{color:var(--ink-soft);font-size:0.82rem;margin:10px 0 0;min-height:1.2em;}

  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .card a.title{
    color:var(--ink);
    font-weight:600;
    font-size:1rem;
    text-decoration:none;
    line-height:1.4;
  }
  .card a.title:hover{color:var(--accent);text-decoration:underline;}
  .meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .badge{
    font-size:0.72rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:999px;
    color:#fff;
  }
  .badge.kl{background:var(--badge-kl);}
  .badge.g{background:var(--badge-g);}
  .date{color:var(--ink-soft);font-size:0.78rem;}
  .snippet{color:var(--ink-soft);font-size:0.85rem;margin-top:8px;line-height:1.5;}

  .empty, .error{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 10px;
    font-size:0.9rem;
  }
  .error{color:#b5453c;}

  .spinner{
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,0.5);
    border-top-color:#fff;
    border-radius:50%;
    display:inline-block;
    animation:spin 0.7s linear infinite;
    vertical-align:-3px;
    margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>물류창고 업계 뉴스</h1>
    <p class="sub">물류신문(물류센터) · 구글 뉴스 — 클릭 한 번으로 최신 소식 모아보기</p>
  </header>

  <div class="panel">
    <div class="controls">
      <button id="searchBtn" onclick="loadNews()">최신 뉴스 검색</button>
      <button class="toggle-kw" onclick="toggleKw()">검색 키워드 수정</button>
    </div>
    <div id="kwBox">
      <input id="kwInput" type="text" placeholder="예: 물류창고, 물류센터 개발, 풀필먼트센터" />
      <p class="kwHint">쉼표(,)로 구분해서 입력하세요. 비워두면 기본 키워드로 검색합니다.</p>
    </div>
    <p class="status" id="status"></p>
  </div>

  <div class="cards" id="results"></div>
</div>

<script>
function toggleKw(){
  document.getElementById('kwBox').classList.toggle('open');
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${y}.${m}.${day} ${hh}:${mm}`;
}

function badgeFor(source){
  const isKl = source === '물류신문';
  return `<span class="badge ${isKl ? 'kl':'g'}">${escapeHtml(source)}</span>`;
}

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadNews(){
  const btn = document.getElementById('searchBtn');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const kwRaw = document.getElementById('kwInput').value.trim();

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>검색 중...';
  status.textContent = '';
  results.innerHTML = '';

  try{
    const url = kwRaw
      ? `/api/news?keywords=${encodeURIComponent(kwRaw)}`
      : `/api/news`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('서버 오류 (' + res.status + ')');
    const data = await res.json();

    if(!data.items || data.items.length === 0){
      results.innerHTML = '<div class="empty">검색된 기사가 없습니다.</div>';
    } else {
      results.innerHTML = data.items.map(item => `
        <div class="card">
          <a class="title" href="${item.link}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
          <div class="meta">
            ${badgeFor(item.source)}
            <span class="date">${formatDate(item.pubDate)}</span>
          </div>
          ${item.snippet ? `<div class="snippet">${escapeHtml(item.snippet)}</div>` : ''}
        </div>
      `).join('');
    }

    status.textContent = `총 ${data.count}건 · ${formatDate(data.updatedAt)} 기준 · 키워드: ${data.keywords.join(', ')}`;
  } catch(err){
    results.innerHTML = `<div class="error">뉴스를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.<br>(${escapeHtml(err.message)})</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '최신 뉴스 검색';
  }
}
</script>
</body>
</html>
